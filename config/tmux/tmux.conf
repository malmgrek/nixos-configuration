# Read after /etc/tmux.conf, which carries the plugin run-shell lines and the
# NixOS module's own defaults. Everything an operator would edit is here, and
# editing it takes effect in the next tmux server rather than at the next
# rebuild. Settings repeated from the system file are deliberate: the later
# value wins, and these are the ones that were chosen.

set -g default-terminal "screen-256color"

# Enable true colors in tmux
set -ga terminal-overrides ",*256col*:Tc"

set -g status-keys vi
set -g mode-keys   vi

# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
setw -g clock-mode-style 24

# The NixOS module defaults this to 500, where home-manager's default was 10.
# Ten is what keeps Esc from lagging in vi mode.
set -s escape-time 10

# Set status bar to top
# set -g status-position top

# If the dracula plugin is ever enabled in home/tmux.nix, these are its
# settings; they belong here rather than in Nix, being plain tmux options.
# set -g @dracula-show-powerline true
# set -g @dracula-fixed-location "Helsinki"
# set -g @dracula-plugins "weather"
# set -g @dracula-show-flags true
# set -g @dracula-show-left-icon session

# Theme. Inline until 021 makes the colour mode a runtime choice; this is the
# dark variant, the one `lightMode.enable = false` selected.

# default statusbar colors
set-option -g status-style bg=colour0,fg=colour213

# default window title colors
set-window-option -g window-status-style fg=colour123,bg=default,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour149,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour81
set-option -g pane-active-border-style fg=colour149

# message text
set-option -g message-style bg=colour81,fg=colour17

# pane number display
set-option -g display-panes-active-colour colour203
set-option -g display-panes-colour colour149

# clock
set-window-option -g clock-mode-colour colour213
